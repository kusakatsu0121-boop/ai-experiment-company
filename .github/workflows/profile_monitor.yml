name: AI company - public Bluesky profile monitor (read only)
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-company-profile-monitor
  cancel-in-progress: false
jobs:
  check-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check public company Bluesky profile
        run: python monitor_bluesky.py
